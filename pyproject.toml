[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odda_utils"
dynamic = ["version"]
description = "MCP server for scientific article management, metadata extraction, and dataset operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPLv3"}
authors = [
    {name = "Alexandre Hutton", email = "alexandre.hutton@proton.me"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GPLv3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.24.0",
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "tqdm>=4.64.0",
    "pdfplumber>=0.9.0",
    "ppx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
visualization = [
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "umap-learn>=0.5.0",
]

[project.scripts]
odda = "odda_utils.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odda_utils = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "odda_utils.__version__"}

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
